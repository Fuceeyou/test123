<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 瑜瑜安房屋裝潢設計 | Uua Housing</title>
    <!-- 引入 Google 字體提升質感 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif+TC:wght@300;500&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
    
    <style>
        /* 基礎樣式重設 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Noto Serif TC', serif;
            background-color: #0b0b0b;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 網頁主視覺背景層 */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            /* 預設使用您的截圖作為背景，建議之後替換成無字體的高清大圖 */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), url('https://blink.kiwi') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 頂部導覽列 */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
            z-index: 10;
        }

        nav ul {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 30px;
        }

        nav ul li a {
            color: #e5e5e5;
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        nav ul li a:hover {
            color: #cda869;
            text-shadow: 0 0 8px rgba(205, 168, 105, 0.6);
        }

        /* 導覽列分隔符號 */
        .divider {
            color: #555;
            font-size: 0.8rem;
            user-select: none;
        }

        /* 品牌核心名稱 (首頁盾徽右側文字) */
        .brand-logo {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            color: #ffffff;
            margin-right: 15px;
        }

        /* 主內容置中區域 */
        .main-content {
            text-align: center;
            z-index: 2;
            max-width: 800px;
            padding: 0 20px;
            margin-top: 40px;
        }

        .welcome-text {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 8px;
            color: #cda869;
            margin-bottom: 10px;
            text-transform: uppercase;
            animation: fadeInDown 1s ease;
        }

        .main-title {
            font-size: 1.8rem;
            letter-spacing: 6px;
            margin-bottom: 25px;
            font-weight: 500;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* 手寫風藝術字體 Uua */
        .cursive-logo {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 6.5rem;
            color: #ffffff;
            line-height: 1;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        .cursive-logo::after {
            content: 'Design';
            font-family: 'Cinzel', serif;
            font-style: normal;
            font-size: 0.8rem;
            position: absolute;
            bottom: 15px;
            right: -40px;
            color: #cda869;
            letter-spacing: 3px;
        }

        .sub-quote {
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #cccccc;
            margin-bottom: 45px;
        }

        /* 探索更多 按鈕 */
        .btn-learn-more {
            font-family: 'Cinzel', serif;
            display: inline-block;
            padding: 12px 40px;
            border: 1px solid #cda869;
            color: #cda869;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 4px;
            transition: all 0.4s ease;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(3px);
        }

        .btn-learn-more:hover {
            background: #cda869;
            color: #0b0b0b;
            box-shadow: 0 0 15px rgba(205, 168, 105, 0.4);
            transform: translateY(-2px);
        }

        /* 頁尾區塊 */
        footer {
            width: 100%;
            background-color: #070707;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #151515;
        }

        .footer-logo {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 2.2rem;
            color: #888;
            margin-bottom: 15px;
        }

        .copyright {
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 1px;
        }

        /* 動態進入效果 */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* RWD 響應式優化 */
        @media (max-width: 768px) {
            header { padding: 20px; }
            nav ul { gap: 15px; }
            nav ul li a { font-size: 0.85rem; letter-spacing: 1px; }
            .cursive-logo { font-size: 4.5rem; }
            .main-title { font-size: 1.4rem; letter-spacing: 4px; }
            .sub-quote { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- 主視覺區塊 -->
    <section class="hero-section">
        
        <!-- 頂部導覽列 -->
        <header>
            <nav>
                <ul>
                    <li class="brand-logo">✦ Uua Housing</li>
                    <li class="divider">|</li>
                    <li><a href="#about">✦ 關於</a></li>
                    <li class="divider">|</li>
                    <li><a href="#works">✦ 作品</a></li>
                    <li class="divider">|</li>
                    <li><a href="#booking">✦ 預約</a></li>
                </ul>
            </nav>
        </header>

        <!-- 主內容文字區 -->
        <div class="main-content">
            <p class="welcome-text">Welcome To</p>
            <h1 class="main-title">FF14 瑜瑜安房屋裝潢設計</h1>
            
            <!-- 置中手寫字體特效 -->
            <div class="cursive-logo">Uua</div>
            
            <p class="sub-quote">· 換個故事的精緻居所 ·</p>
            
            <a href="#works" class="btn-learn-more">LEARN MORE</a>
        </div>

    </section>

    <!-- 頁尾 -->
    <footer>
        <div class="footer-logo">Uua</div>
        <p class="copyright">© 2026 瑜安@伊弗利特 | 著作權所有 未經授權請勿轉載</p>
    </footer>

</body>
</html>
